name: 每日更新基金資料

on:
  schedule:
    # 台灣時間每天 22:30（UTC 14:30），基富通當日淨值多半已更新
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓資料
        run: python scripts/fetch_funds.py
      - name: 有變動才 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/funds.json
          if git diff --cached --quiet; then
            echo "資料沒有變動"
          else
            git commit -m "data: $(TZ=Asia/Taipei date +%F) 基金資料更新"
            git push
          fi
